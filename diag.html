<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>diag</title>
<style>body{font-family:monospace;font-size:13px;padding:14px;background:#111;color:#eee;white-space:pre-wrap}</style>
</head><body data-install-button="off">
<div id="out">...</div>
<script>
(async () => {
  const l = [];
  l.push("body.dataset.installButton = " + JSON.stringify(document.body.dataset.installButton));
  l.push("bouton #pwa-install present = " + !!document.getElementById("pwa-install"));
  l.push("boutons dans body = " + document.body.querySelectorAll("button").length);
  const regs = await navigator.serviceWorker.getRegistrations();
  l.push("registrations = " + regs.length);
  for (const r of regs) {
    l.push("  scope " + r.scope);
    l.push("  active " + (r.active ? r.active.state : "-") + " | waiting " + (r.waiting ? "oui" : "non") + " | installing " + (r.installing ? "oui" : "non"));
  }
  l.push("controller = " + (navigator.serviceWorker.controller ? navigator.serviceWorker.controller.scriptURL : "aucun"));
  const noms = await caches.keys();
  l.push("caches = " + JSON.stringify(noms));
  for (const n of noms) {
    const c = await caches.open(n);
    const k = await c.keys();
    l.push("  " + n + " : " + k.length + " entrees");
    const pj = k.find(x => x.url.includes("pwa.js"));
    if (pj) {
      const txt = await (await c.match(pj)).text();
      l.push("    pwa.js en cache contient la condition install=" + txt.includes('installButton !== "off"'));
    }
  }
  const enLigne = await (await fetch("pwa.js?probe=" + Date.now(), {cache:"no-store"})).text();
  l.push("pwa.js reseau contient la condition install=" + enLigne.includes('installButton !== "off"'));
  l.push("pwa.js reseau contient redirection app=" + enLigne.includes("app.html?source=pwa"));
  document.getElementById("out").textContent = l.join("\n");
})();
</script></body></html>
