<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hors ligne — Komara Agency 🇬🇳</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<style>
  :root { --noir:#0a0a0a; --or:#FFD700; --blanc:#fff; --doux:#a8a49b; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(900px 500px at 50% 0%, #17171b 0%, var(--noir) 60%);
    color:var(--blanc); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    text-align:center; padding:28px;
  }
  body::before {
    content:""; position:fixed; top:0; left:0; right:0; height:4px; z-index:9;
    background:linear-gradient(90deg,#d11231 0 33.3%,#f5cf1b 33.3% 66.6%,#009a44 66.6% 100%);
  }
  .carte {
    max-width:460px; width:100%; border:1px solid rgba(255,215,0,.3); border-radius:18px;
    background:#101014; padding:34px 24px;
  }
  img { width:96px; height:96px; margin-bottom:14px; }
  h1 { font-size:22px; margin:0 0 10px; color:var(--or); }
  p { color:var(--doux); margin:0 0 18px; line-height:1.6; font-size:15px; }
  a.bouton {
    display:inline-block; background:var(--or); color:#000; text-decoration:none;
    font-weight:700; padding:13px 22px; border-radius:10px;
  }
  .wa { display:block; margin-top:14px; color:#25D366; text-decoration:none; font-size:14px; }
</style>
</head>
<body>
  <div class="carte">
    <img src="assets/logo-256.png" alt="Komara Agency">
    <h1>Pas de connexion 😕</h1>
    <p>Tu es hors ligne. Les pages déjà visitées restent accessibles, mais cette page doit être rechargée dès que le réseau revient.</p>
    <a class="bouton" href="./">Réessayer</a>
    <a class="wa" href="https://wa.me/212701986219">Ou écris-nous sur WhatsApp</a>
  </div>
</body>
</html>
