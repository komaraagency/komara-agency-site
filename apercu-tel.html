<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Apercu telephone</title>
<style>
html,body{margin:0;background:#222;font-family:system-ui}
.cadre{display:flex;justify-content:center;gap:14px;padding:12px}
.tel{width:360px;height:700px;border:8px solid #000;border-radius:30px;overflow:hidden;background:#000}
iframe{width:100%;height:100%;border:0;display:block}
p{color:#bbb;text-align:center;margin:0 0 4px;font-size:12px}
pre{color:#8f8;font-size:11px;margin:4px 0 0;white-space:pre-wrap;max-width:376px}
</style></head><body>
<div class="cadre">
  <div><p>Accueil</p><div class="tel"><iframe id="f1" src="app.html?z=11#accueil"></iframe></div><pre id="m1"></pre></div>
  <div><p>Offres</p><div class="tel"><iframe id="f2" src="app.html?z=12#offres"></iframe></div><pre id="m2"></pre></div>
  <div><p>Devis</p><div class="tel"><iframe id="f3" src="app.html?z=13#devis"></iframe></div><pre id="m3"></pre></div>
</div>
<script>
(async function(){
  try{
    var regs=await navigator.serviceWorker.getRegistrations();
    for(var r of regs) await r.unregister();
    var noms=await caches.keys();
    for(var n of noms) await caches.delete(n);
  }catch(e){}
  ["f1","f2","f3"].forEach(function(id){
    var f=document.getElementById(id);
    f.src=f.src.split("#")[0].replace(/z=\d+/,"z="+Date.now())+"#"+(id==="f1"?"accueil":id==="f2"?"offres":"devis");
  });
})();
function mesure(fid, mid){
  var f=document.getElementById(fid), out=document.getElementById(mid);
  try{
    var d=f.contentDocument, w=f.contentWindow, bad=[];
    var ecran=d.querySelector(".ecran.actif");
    var largeur=w.innerWidth;
    d.querySelectorAll(".ecran.actif *").forEach(function(el){
      var r=el.getBoundingClientRect();
      if(r.width>0 && (r.right>largeur+1 || r.left<-1)) bad.push(el.className||el.tagName);
    });
    var tailles=[];
    d.querySelectorAll(".ecran.actif *").forEach(function(el){
      if(el.children.length===0 && el.textContent.trim().length>1){
        tailles.push(parseFloat(w.getComputedStyle(el).fontSize));
      }
    });
    var mini=Math.min.apply(null,tailles);
    out.textContent="largeur "+largeur+"px | scrollW "+ecran.scrollWidth+
      " | depassent: "+(bad.length?bad.slice(0,4).join(", "):"aucun")+
      " | plus petit texte: "+mini.toFixed(1)+"px";
  }catch(e){out.textContent="erreur "+e.message}
}
setTimeout(function(){mesure("f1","m1");mesure("f2","m2");mesure("f3","m3");},6500);
</script>
</body></html>
