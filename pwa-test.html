<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>PWA check</title>
<script src="./pwa.js" defer></script></head>
<body style="font-family:monospace;padding:20px">
<h3>Diagnostic PWA</h3>
<pre id="out">chargement…</pre>
<script>
setTimeout(async () => {
  const l = [];
  l.push("manifest: " + (document.querySelector('link[rel=manifest]') ? "absent sur cette page test" : "n/a"));
  l.push("serviceWorker supported: " + ("serviceWorker" in navigator));
  try {
    await navigator.serviceWorker.register("./sw.js", { scope: "./" });
    l.push("registration: OK");
  } catch (e) { l.push("registration: ECHEC " + e.message); }
  const regs = await navigator.serviceWorker.getRegistrations();
  l.push("registrations: " + regs.length);
  for (const r of regs) {
    l.push("  scope: " + r.scope);
    l.push("  active: " + (r.active ? r.active.state : "aucun"));
  }
  l.push("controlled: " + !!navigator.serviceWorker.controller);
  const noms = await caches.keys();
  l.push("caches: " + JSON.stringify(noms));
  for (const n of noms) {
    const c = await caches.open(n);
    const k = await c.keys();
    l.push("  " + n + ": " + k.length + " entrees");
  }
  l.push("reseau: " + (navigator.onLine ? "en ligne" : "hors ligne"));
  document.getElementById("out").textContent = l.join("\n");
}, 2500);
</script></body></html>
