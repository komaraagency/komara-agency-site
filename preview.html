<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Apercu mobile</title>
<style>
html,body{margin:0;background:#2b2b2b;font-family:system-ui}
.cadre{display:flex;justify-content:center;gap:24px;padding:18px}
.tel{width:390px;height:844px;border:10px solid #000;border-radius:38px;overflow:hidden;background:#000;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.tel.android{width:360px;height:800px}
iframe{width:100%;height:100%;border:0;display:block}
p{color:#bbb;text-align:center;margin:0 0 6px;font-size:13px}
.mesures{color:#8f8;font-family:monospace;font-size:12px;white-space:pre-line;background:#111;padding:8px;border-radius:8px;margin-top:8px}
</style></head>
<body>
<div class="cadre">
  <div>
    <p>iPhone 390 x 844</p>
    <div class="tel"><iframe id="a" src="app.html#accueil"></iframe></div>
    <div class="mesures" id="ma">mesure…</div>
  </div>
  <div>
    <p>Android 360 x 800</p>
    <div class="tel android"><iframe id="b" src="app.html#offres"></iframe></div>
    <div class="mesures" id="mb">mesure…</div>
  </div>
</div>
<script>
function mesurer(id, cible) {
  var f = document.getElementById(id);
  try {
    var d = f.contentDocument, w = f.contentWindow;
    var app = d.querySelector(".app");
    var barre = d.querySelector(".tabbar");
    var r = barre ? barre.getBoundingClientRect() : null;
    var texte = [
      "viewport      : " + w.innerWidth + " x " + w.innerHeight,
      "largeur .app  : " + Math.round(app.getBoundingClientRect().width) + " px (" +
        Math.round(app.getBoundingClientRect().width / w.innerWidth * 100) + " %)",
      "debordement   : " + (d.documentElement.scrollWidth > w.innerWidth ? "OUI" : "non"),
      "bas tabbar    : " + (r ? Math.round(r.bottom) : "?") + " / " + w.innerHeight,
      "ecran defile : " + (d.querySelector(".ecran.actif").scrollHeight > w.innerHeight ? "oui" : "contenu tient")
    ];
    document.getElementById(cible).textContent = texte.join("\n");
  } catch (e) {
    document.getElementById(cible).textContent = "mesure impossible: " + e.message;
  }
}
["a","b"].forEach(function(id){});
setTimeout(function(){ mesurer("a","ma"); mesurer("b","mb"); }, 2500);
</script>
</body></html>
